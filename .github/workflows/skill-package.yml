name: Build Skill Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: 打包 1panel 技能包
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version
        id: version
        run: |
          VERSION="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: python3 -m unittest discover -s tests

      - name: Build skill package
        run: |
          scripts/install_skill.sh dist/1panel-skill
          cat > dist/1panel-skill/install.sh <<'EOF'
          #!/usr/bin/env bash
          # 将本技能包安装到 AI 工具的 skills 目录。
          # 用法: bash install.sh [目标目录]
          # 默认:已存在 ~/.config/opencode/skills 时装到 opencode,否则尝试 Claude Code,
          #       都不存在时使用 opencode 默认路径。
          set -euo pipefail

          SRC="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"

          if [[ $# -ge 1 ]]; then
            TARGET="$1"
          elif [[ -d "$HOME/.config/opencode/skills" ]]; then
            TARGET="$HOME/.config/opencode/skills/1panel-skill"
          elif [[ -d "$HOME/.claude/skills" ]]; then
            TARGET="$HOME/.claude/skills/1panel-skill"
          else
            TARGET="$HOME/.config/opencode/skills/1panel-skill"
          fi

          if [[ "$(cd "$TARGET" 2>/dev/null && pwd || true)" == "$SRC" ]]; then
            echo "当前目录就是目标目录: $TARGET"
            exit 0
          fi

          mkdir -p "$TARGET/bin" "$TARGET/references"
          rm -rf "$TARGET/panel_cli" "$TARGET/references"
          cp -r "$SRC/panel_cli" "$TARGET/panel_cli"
          cp -r "$SRC/references/." "$TARGET/references/"
          cp "$SRC/SKILL.md" "$SRC/commands.md" "$SRC/README.md" "$SRC/.env.example" "$TARGET/"
          cp "$SRC/bin/1panel-cli" "$TARGET/bin/1panel-cli"
          cp "$SRC/.env.example" "$TARGET/bin/.env.example"
          chmod +x "$TARGET/bin/1panel-cli"
          find "$TARGET/panel_cli" -name __pycache__ -type d -exec rm -rf {} + 2>/dev/null || true

          echo "已安装到: $TARGET"
          echo "验证: $TARGET/bin/1panel-cli --version"
          EOF
          chmod +x dist/1panel-skill/install.sh
          find dist/1panel-skill -name __pycache__ -type d -exec rm -rf {} + 2>/dev/null || true
          dist/1panel-skill/bin/1panel-cli --version
          ls -la dist/1panel-skill

      - name: Zip package
        run: |
          cd dist
          zip -qr "1panel-skill-${{ steps.version.outputs.version }}.zip" 1panel-skill

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1panel-skill-${{ steps.version.outputs.version }}
          path: dist/1panel-skill
          if-no-files-found: error
          include-hidden-files: true

      - name: Create release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/1panel-skill-${VERSION}.zip" \
            --title "1panel-cli Skill ${GITHUB_REF_NAME}" \
            --notes "1Panel v2 面板管理 Agent Skill(Python 版),验证基线 1Panel v2.2.5。

          下载 zip 解压后运行 bash install.sh,或手动把 1panel-skill 目录复制到 opencode / Claude Code 的 skills 目录。"

      - name: Job summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "## 1panel 技能包已生成"
            echo ""
            echo "- 版本: \`${VERSION}\`"
            echo "- 产物: 本页 **Artifacts** 区域的 \`1panel-skill-${VERSION}\`(zip,解压得到 \`1panel-skill/\` 目录)"
            echo ""
            echo "### 安装"
            echo '```sh'
            echo "# 解压下载的 artifact"
            echo "cd 1panel-skill"
            echo "bash install.sh                  # 自动安装到 opencode 或 Claude Code 的 skills 目录"
            echo "bash install.sh /自定义/技能目录  # 或显式指定目标目录"
            echo ""
            echo "# 手动安装(opencode 示例)"
            echo "mv 1panel-skill ~/.config/opencode/skills/"
            echo '```'
            echo ""
            echo "验证: \`~/.config/opencode/skills/1panel-skill/bin/1panel-cli --version\`"
          } >> "$GITHUB_STEP_SUMMARY"
