name: Build Skill Package

# 说明:本 workflow 不依赖任何 GitHub 托管 action(部分 runner 无法访问 github.com),
# 全部步骤使用 run + 平台自带的 GITHUB_TOKEN 完成:
#   - 用 git clone + GITHUB_TOKEN 拉代码(替代 actions/checkout)
#   - 单元测试 / 打包 / 压缩(替代 setup-python、upload-artifact)
#   - 用 curl 调 GITHUB_API_URL 创建/更新 Release 并上传附件(替代 gh CLI)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: 打包 1panel 技能包
    runs-on: ubuntu-latest
    steps:
      - name: 环境检查
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "server=${GITHUB_SERVER_URL:-?} repo=${GITHUB_REPOSITORY:-?} ref=${GITHUB_REF:-?}"
          echo "sha=${GITHUB_SHA:-?} api=${GITHUB_API_URL:-?}"
          if [ -n "${GITHUB_TOKEN:-}" ]; then echo "token: set"; else echo "token: empty"; fi
          git --version
          python3 --version
          if command -v zip >/dev/null 2>&1; then echo "zip: ok"; else echo "zip: 缺失(用 python3 zipfile 兜底)"; fi

      - name: 拉取代码(GIT_SERVER + GITHUB_TOKEN)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          SERVER="${GITHUB_SERVER_URL:-https://github.com}"; SERVER="${SERVER%/}"
          SCHEME="${SERVER%%://*}"; HOST="${SERVER#*://}"
          REF="${GITHUB_REF_NAME:-master}"
          rm -rf repo
          git clone --quiet --depth 1 --branch "$REF" \
            "${SCHEME}://x-access-token:${GITHUB_TOKEN}@${HOST}/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git log --oneline -1
          echo "workspace=$PWD"

      - name: 单元测试
        run: |
          cd repo
          python3 -m unittest discover -s tests

      - name: 打包技能包
        run: |
          cd repo
          scripts/build_skill_package.sh "$PWD/dist"
          dist/1panel-skill/bin/1panel-cli --version

      - name: 发布 Release(仅 tag;curl 调 API,兼容 Gitea/GitHub)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_TOKEN:-}" ]; then
            echo "GITHUB_TOKEN 未注入,无法发布 Release(检查 workflow 的 permissions/secrets)"; exit 1
          fi
          cd repo
          TAG="${GITHUB_REF_NAME}"
          API="${GITHUB_API_URL:-https://api.github.com}"
          REPO="${GITHUB_REPOSITORY}"
          AUTH="Authorization: token ${GITHUB_TOKEN}"
          VERSION="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          ASSET="dist/1panel-skill-${VERSION}.zip"
          [ -f "$ASSET" ] || { echo "缺少附件: $ASSET"; exit 1; }
          NOTES="1Panel v2 面板管理 Agent Skill(Python 版),CLI 版本 ${VERSION},验证基线 1Panel v2.3.2。下载 zip 解压后运行 bash install.sh,或手动把 1panel-skill 目录复制到 opencode / Claude Code 的 skills 目录。"

          REL_JSON="$(curl -sS -H "$AUTH" "$API/repos/$REPO/releases/tags/$TAG")"
          REL_ID="$(printf '%s' "$REL_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id", 0))' 2>/dev/null || echo 0)"
          if [ "${REL_ID:-0}" = "0" ]; then
            PAYLOAD="$(python3 -c 'import json,sys; print(json.dumps({"tag_name": sys.argv[1], "name": sys.argv[2], "body": sys.argv[3], "draft": False, "prerelease": False}))' \
              "$TAG" "1panel-cli Skill $TAG" "$NOTES")"
            REL_JSON="$(curl -sS -H "$AUTH" -H 'Content-Type: application/json' -X POST \
              "$API/repos/$REPO/releases" -d "$PAYLOAD")"
            REL_ID="$(printf '%s' "$REL_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id", 0))' 2>/dev/null || echo 0)"
            echo "已创建 Release: $TAG (id=$REL_ID)"
          else
            echo "Release 已存在: $TAG (id=$REL_ID),更新附件并保留现有说明"
          fi
          [ "${REL_ID:-0}" != "0" ] || { echo "创建/查询 Release 失败"; exit 1; }

          # 附件上传端点:GitHub 必须用响应里的 upload_url(uploads.github.com,{?name,label} 要去掉),
          # Gitea 没有该字段时回退到 api 基址
          UPLOAD_URL="$(printf '%s' "$REL_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("upload_url", ""))' 2>/dev/null || echo "")"
          UPLOAD_URL="${UPLOAD_URL%%\{*}"
          [ -n "$UPLOAD_URL" ] || UPLOAD_URL="$API/repos/$REPO/releases/$REL_ID/assets"
          echo "上传端点: $UPLOAD_URL"

          # 附件上传:每次重试前按 Release ID 现拉一次资产列表(避免缓存拿到过期 id),
          # 删除同名旧附件后 GitHub 存在一致性延迟,失败自动重试
          UP_OK=0
          for i in 1 2 3 4 5 6; do
            FRESH_JSON="$(curl -sS -H "$AUTH" "$API/repos/$REPO/releases/$REL_ID")"
            printf '%s' "$FRESH_JSON" | python3 -c 'import json,sys; [print(a["id"]) for a in json.load(sys.stdin).get("assets", []) if a["name"] == sys.argv[1]]' "$(basename "$ASSET")" | while read -r AID; do
              DEL_CODE="$(curl -sS -o /dev/null -w '%{http_code}' -H "$AUTH" -X DELETE "$API/repos/$REPO/releases/assets/$AID")"
              echo "删除同名旧附件 id=$AID (HTTP $DEL_CODE)"
              sleep 2
            done
            # GitHub: 附件内容是请求体原样存储,必须 --data-binary;
            # Gitea: 需要 multipart 的 attachment 字段
            if [[ "$UPLOAD_URL" == *github.com* ]]; then
              UP_JSON="$(curl -sS -H "$AUTH" -H 'Content-Type: application/octet-stream' -X POST \
                "$UPLOAD_URL?name=$(basename "$ASSET")" --data-binary "@${ASSET}")"
            else
              UP_JSON="$(curl -sS -H "$AUTH" -X POST \
                "$UPLOAD_URL?name=$(basename "$ASSET")" -F "attachment=@${ASSET}")"
            fi
            # 校验:存在 id 且线上字节数与本地一致(防止上传内容被外层包裹/截断)
            if printf '%s' "$UP_JSON" | python3 -c 'import json,sys,os; d=json.load(sys.stdin); sys.exit(0 if d.get("id") and int(d.get("size",-1))==os.path.getsize(sys.argv[1]) else 1)' "$ASSET"; then
              UP_OK=1; break
            fi
            echo "第 $i 次上传未成功,5 秒后重试: $(printf '%s' "$UP_JSON" | head -c 200)"
            sleep 5
          done
          [ "$UP_OK" = "1" ] || { echo "附件上传失败,最后一次响应: $(printf '%s' "$UP_JSON" | head -c 300)"; exit 1; }
          printf '%s' "$UP_JSON" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("已上传附件:", d.get("name"), d.get("size"), d.get("browser_download_url",""))'
          echo "Release: ${GITHUB_SERVER_URL:-https://github.com}/${REPO}/releases/tag/$TAG"

      - name: Job summary
        run: |
          set -e
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "## 1panel 技能包构建完成"
              echo ""
              echo "- 仓库: \`${GITHUB_REPOSITORY}\`"
              echo "- Ref: \`${GITHUB_REF}\`"
              echo "- 附件: \`1panel-skill-<version>.zip\`(tag 构建时已附加到 Release)"
              echo ""
              echo "### 安装"
              echo '```sh'
              echo "# 解压下载的 zip 后"
              echo "cd 1panel-skill"
              echo "bash install.sh                  # 自动安装到 opencode 或 Claude Code 的 skills 目录"
              echo "bash install.sh /自定义/技能目录  # 或显式指定目标目录"
              echo '```'
              echo ""
              echo "验证: \`<技能目录>/bin/1panel-cli --version\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
